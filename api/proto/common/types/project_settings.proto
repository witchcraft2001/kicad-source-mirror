/*
 * project_settings.proto
 * Messages that describes project settings shared between schematics and boards
 */

syntax = "proto3";

package kiapi.common.project;

import "common/types/base_types.proto";
import "common/types/enums.proto";
import "board/board_types.proto";

message NetClassBoardSettings
{
  optional kiapi.common.types.Distance clearance = 1;
  optional kiapi.common.types.Distance track_width = 2;
  optional kiapi.common.types.Distance diff_pair_track_width = 3;
  optional kiapi.common.types.Distance diff_pair_gap = 4;
  optional kiapi.common.types.Distance diff_pair_via_gap = 5;

  // The default padstack to use for vias belonging to this netclass
  // Currently KiCad only supports specifying the drill diameter and annular size on all layers for
  // netclass via stacks.  Complex padstacks and other via features cannot be specified here.
  optional kiapi.board.types.PadStack via_stack = 6;

  // The default padstack to use for microvias belonging to this netclass
  // Currently KiCad only supports specifying the drill diameter and annular size on all layers for
  // netclass via stacks.  Complex padstacks and other via features cannot be specified here.
  optional kiapi.board.types.PadStack microvia_stack = 7;

  optional kiapi.common.types.Color color = 8;

  // Since 10.0.0
  optional string tuning_profile = 9;
}

message NetClassSchematicSettings
{
  optional kiapi.common.types.Distance wire_width = 1;
  optional kiapi.common.types.Distance bus_width = 2;
  optional kiapi.common.types.Color color = 3;
  optional kiapi.common.types.StrokeLineStyle line_style = 4;
}

enum NetClassType
{
  NCT_UNKNOWN = 0;
  // An explicitly-defined netclass, created by the user and saved in the project file
  NCT_EXPLICIT = 1;
  // An implicit (effective) netclass, made up of multiple explicit netclasses
  NCT_IMPLICIT = 2;
}

message NetClass
{
  // The name of the netclass (the literal string "Default" for the default netclass)
  // May be empty for composite netclasses
  string name = 1;

  optional int32 priority = 2;

  optional NetClassBoardSettings board = 3;
  optional NetClassSchematicSettings schematic = 4;

  NetClassType type = 5;

  // If this is a composite netclass, a list of the names of the "real" netclasses that make it up
  repeated string constituents = 6;
}

// A direct assignment of netclasses to a net, equivalent to the assignments
// created by netclass labels in a schematic.
message NetClassAssignment
{
  // Full net path (e.g. "/sheet1/net1"). May refer to a net that does not exist yet.
  string net = 1;

  // Names of netclasses assigned to the net.
  // In MMM_MERGE mode, an empty list removes all assignments for this net.
  repeated string netclasses = 2;
}

// A pattern-based netclass assignment, matching net names by wildcard.
message NetClassPatternAssignment
{
  // Wildcard pattern matched against full net paths (e.g. "/power/*").
  string pattern = 1;

  // Name of the netclass assigned to matching nets.
  // In MMM_MERGE mode, an empty string removes the pattern.
  string netclass = 2;
}

message TextVariables
{
  map<string, string> variables = 1;
}

enum TuningProfileType
{
  TPT_UNKNOWN      = 0;
  TPT_SINGLE       = 1;
  TPT_DIFFERENTIAL = 2;
}

// The geometry and propagation delay of one signal layer in a tuning profile
message TuningProfileLayer
{
  kiapi.board.types.BoardLayer signal_layer = 1;

  // The reference planes above and below the signal layer; BL_UNDEFINED for none
  kiapi.board.types.BoardLayer top_reference_layer = 2;
  kiapi.board.types.BoardLayer bottom_reference_layer = 3;

  // Track width giving the target impedance; zero leaves the width to the netclass and rules
  kiapi.common.types.Distance width = 4;

  // Gap giving the target differential impedance (differential profiles only)
  kiapi.common.types.Distance diff_pair_gap = 5;

  // Propagation delay of a track on this layer, in attoseconds per millimetre
  // (1 ps/mm = 1000000)
  int64 delay_per_mm = 6;
}

// The propagation delay of a via between two signal layers, replacing the profile default
message TuningProfileViaOverride
{
  kiapi.board.types.BoardLayer signal_layer_from = 1;
  kiapi.board.types.BoardLayer signal_layer_to = 2;
  kiapi.board.types.BoardLayer via_layer_from = 3;
  kiapi.board.types.BoardLayer via_layer_to = 4;
  kiapi.common.types.Time delay = 5;
}

// A tuning profile (Board Setup > Tuning Profiles): the per-layer track geometry for a target
// impedance and the propagation delays used for time domain length tuning.  Assign a profile to a
// netclass with NetClassBoardSettings.tuning_profile.
// Since: 11.0
message TuningProfile
{
  string name = 1;
  TuningProfileType type = 2;

  // Target impedance in ohms (differential impedance for differential profiles)
  double target_impedance = 3;

  // Frequency in hertz at which the impedance and delay were calculated
  double frequency = 4;

  // When false, delays are not used and tuning works on lengths only
  bool enable_time_domain_tuning = 5;
  bool model_solder_mask = 6;

  repeated TuningProfileLayer layers = 7;

  // Default propagation delay through vias, in attoseconds per millimetre of via length
  int64 via_delay_per_mm = 8;

  repeated TuningProfileViaOverride via_overrides = 9;

  // Propagation delay of net chain bridges, in attoseconds per millimetre
  int64 net_chain_bridge_delay_per_mm = 10;
}
