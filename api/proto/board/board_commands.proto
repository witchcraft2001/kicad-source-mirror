  repeated kiapi.board.types.BoardLayer layers = 1;
}

message SetVisibleLayers
{
  kiapi.common.types.DocumentSpecifier board = 1;

  repeated kiapi.board.types.BoardLayer layers = 2;
}

// returns BoardLayerResponse
message GetActiveLayer
{
  kiapi.common.types.DocumentSpecifier board = 1;
}

message SetActiveLayer
{
  kiapi.common.types.DocumentSpecifier board = 1;

  kiapi.board.types.BoardLayer layer = 2;
}

enum InactiveLayerDisplayMode
{
  ILDM_UNKNOWN = 0;
  // Inactive layers are shown
  ILDM_NORMAL = 1;
  // Inactive layers are shown with dimmed colors
  ILDM_DIMMED = 2;
  // Inactive layers are hidden
  ILDM_HIDDEN = 3;
}

enum NetColorDisplayMode
{
  NCDM_UNKNOWN = 0;
  // Net and netclass colors are shown in the ratsnest and on all copper items
  NCDM_ALL = 1;
  // Net and netclass colors are shown in the ratsnest only
  NCDM_RATSNEST = 2;
  // Net and netclass colors are not shown
  NCDM_OFF = 3;
}

enum BoardFlipMode
{
  BFM_UNKNOWN = 0;
  // Normal ("non-flipped") mode
  BFM_NORMAL = 1;
  // "Flipped" mode, viewed from the back and mirrored around the X axis
  BFM_FLIPPED_X = 2;
}

enum RatsnestDisplayMode
{
  RDM_UNKNOWN = 0;
  // Ratsnest lines are drawn to objects even if they are on hidden layers
  RDM_ALL_LAYERS = 1;
  // Ratsnest lines are hidden when at least one endpoint is an item on a hidden layer
  RDM_VISIBLE_LAYERS = 2;
}

message BoardEditorAppearanceSettings
{
  InactiveLayerDisplayMode inactive_layer_display = 1;

  NetColorDisplayMode net_color_display = 2;

  BoardFlipMode board_flip = 3;

  RatsnestDisplayMode ratsnest_display = 4;
}

// Returns BoardEditorAppearanceSettings
message GetBoardEditorAppearanceSettings
{
}

message SetBoardEditorAppearanceSettings
{
  BoardEditorAppearanceSettings settings = 1;
}

// Returns BoardPlotSettingsResponse
message GetBoardPlotSettings
{
  kiapi.common.types.DocumentSpecifier board = 1;
}

message SetBoardPlotSettings
{
  kiapi.common.types.DocumentSpecifier board = 1;
  kiapi.board.jobs.BoardPlotSettings plot_settings = 2;
}

message BoardPlotSettingsResponse
{
  kiapi.board.jobs.BoardPlotSettings plot_settings = 1;
}

enum BoardFlipDirection
{
  BFD_UNKNOWN    = 0;
  BFD_LEFT_RIGHT = 1; // Flip left to right (around the Y axis)
  BFD_TOP_BOTTOM = 2; // Flip top to bottom (around the X axis)
}

// Flips one or more board items to the opposite side of the board.  Returns FlipItemsResponse.
message FlipItems
{
  kiapi.common.types.ItemHeader header = 1;

  repeated kiapi.common.types.KIID items = 2;

  // Direction to flip the items; BFD_TOP_BOTTOM if unspecified.
  BoardFlipDirection direction = 3;
}

message ItemFlipResult
{
  kiapi.common.commands.ItemStatus status = 1;

  // Updated version of the item after the flip (only populated when status.status is ISC_OK)
  google.protobuf.Any item = 2;
}

message FlipItemsResponse
{
  kiapi.common.types.ItemHeader header = 1;

  // Status of the overall request; may return IRS_OK even if no items were flipped
  kiapi.common.types.ItemRequestStatus status = 2;

  repeated ItemFlipResult flipped_items = 3;
}

// Requests placement of a footprint on a board
// Returns PlaceFromLibraryResponse
// Since: 11.0
message PlaceFootprintFromLibrary
{
  kiapi.common.types.ItemHeader header = 1;

  kiapi.common.types.LibraryIdentifier lib_id = 2;

  kiapi.common.types.Vector2 position = 3;

  // If unspecified, will use default orientation
  optional kiapi.common.types.Angle orientation = 4;

  // If unspecified, will place on F_Cu.  Footprint will be flipped if placed on B_Cu.
  optional kiapi.board.types.BoardLayer layer = 5;
}

// Which parts of a footprint on the board are reset to the library definition by ExchangeFootprints.
// The unset fields take the defaults of the Update Footprints dialog when lib_id is unset and of the
// Change Footprints dialog when it is set.
// Since: 11.0
message ExchangeFootprintsOptions
{
  // Move and rotate the new footprint so that its pads land on the pads of the old one
  // (default: true)
  optional bool match_pad_positions = 1;

  // Delete texts that exist on the board footprint but not in the library one
  // (default: false)
  optional bool delete_extra_texts = 2;

  // Reset the layers of the footprint texts (default: false when updating, true when changing)
  optional bool reset_text_layers = 3;

  // Reset the size, thickness, style and justification of the footprint texts
  // (default: false when updating, true when changing)
  optional bool reset_text_effects = 4;

  // Reset the positions of the footprint texts (default: false when updating, true when changing)
  optional bool reset_text_positions = 5;

  // Reset the contents of the footprint texts (default: false when updating, true when changing)
  optional bool reset_text_content = 6;

  // Reset the fabrication attributes (default: false when updating, true when changing)
  optional bool reset_fabrication_attributes = 7;

  // Reset the clearance, mask, paste and zone connection overrides
  // (default: true)
  optional bool reset_clearance_overrides = 8;

  // Take the 3D models, extruded bodies and embedded model files from the library
  // (default: true)
  optional bool reset_3d_models = 9;

  // Reset the scale of the footprint (default: false when updating, true when changing)
  optional bool reset_transform = 10;
}

// Replaces footprints on the board with the library definition, like the Update Footprints and
// Change Footprints dialogs of the PCB editor: the position, orientation, side, lock state, reference,
// UUIDs, nets of matching pads, groups and sheet links of each footprint are kept, and so is the value
// unless it is the name of the old footprint.  When updating, a footprint without a library nickname
// is looked for in every library.
// The library is re-read from disk first when it has changed since it was last loaded.
// Returns ExchangeFootprintsResponse
// Since: 11.0
message ExchangeFootprints
{
  kiapi.common.types.ItemHeader header = 1;

  // The footprints to replace
  repeated kiapi.common.types.KIID footprints = 2;

  // If set, the footprints are changed to this library footprint (Change Footprints).  If unset,
  // each footprint is updated from the library footprint it already refers to (Update Footprints).
  kiapi.common.types.LibraryIdentifier lib_id = 3;

  ExchangeFootprintsOptions options = 4;

  // Report what would change without changing anything.  A dry run compares the board footprints with
  // the library; changes made to a footprint on the board that a text or transform reset would undo
  // are not reported.
  bool dry_run = 5;
}

// Since: 11.0
enum FootprintExchangeStatus
{
  FES_UNKNOWN = 0;

  // The footprint was replaced (or would be, for a dry run)
  FES_UPDATED = 1;

  // Only the position or angle of the footprint changed, to match its pads to the library
  FES_SHIFTED = 2;

  // The footprint already matches the library definition (update mode only)
  FES_UNCHANGED = 3;

  // The library footprint could not be found or loaded; see the message
  FES_NOT_FOUND = 4;

  // The item does not exist on the board or is not a footprint
  FES_NONEXISTENT = 5;
}

// Since: 11.0
message FootprintExchangeResult
{
  // The footprint, as requested.  The UUID is kept by the exchange.
  kiapi.common.types.KIID footprint = 1;

  FootprintExchangeStatus status = 2;

  // The library footprint that was used
  kiapi.common.types.LibraryIdentifier lib_id = 3;

  // The differences found (dry run and update mode), or the reason for a failure
  string message = 4;

  // The footprint after the exchange (not set for a dry run or a failure)
  google.protobuf.Any item = 5;
}

// Since: 11.0
message ExchangeFootprintsResponse
{
  kiapi.common.types.ItemHeader header = 1;

  repeated FootprintExchangeResult results = 2;
}

// What items to use to calculate the board bounding box
// Since: 11.0
enum BoardBoundingBoxMode
{
  BBBM_UNKNOWN = 0;
  // All board items on visible layers
  BBBM_ALL_ITEMS = 1;
  // Items on visible physical (copper/technical) layers only
  BBBM_PHYSICAL_LAYERS_ONLY = 2;
  // Graphics on Edge.Cuts only
  BBBM_BOARD_EDGES_ONLY = 3;
}

// Returns BoardBoundingBoxResponse
// Since: 11.0
message GetBoardBoundingBox
{
  kiapi.common.types.DocumentSpecifier board = 1;
  BoardBoundingBoxMode mode = 2;
}

// Since: 11.0
message BoardBoundingBoxResponse
{
  kiapi.common.types.Box2 box = 1;  // zero-size box for an empty board
}


//// Interactive commands ////
// These commands begin an interactive operation in the editor.
// They return a response immediately, but the editor will become busy
// and will not reply to further API commands until the user has finished
// the operation.
// These commands will return an error if received in a non-interactive context.

// Selects and begins an interactive move of the given item(s).
// NOTE: Takes ownership of the active commit, if one exists:
//       the move tool will push the commit when the user confirms the move,
//       or roll back the commit if the user cancels the move.  Keep this in
//       mind if using this command in combination with commands that create
//       or modify items using an explicit commit.
message InteractiveMoveItems
{
  kiapi.common.types.DocumentSpecifier board = 1;

  repeated kiapi.common.types.KIID items = 2;
}
