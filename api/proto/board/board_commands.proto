/*
 * Board stackup and properties
 */

message GetBoardStackup
{
  kiapi.common.types.DocumentSpecifier board = 1;
}

message BoardStackupResponse
{
  kiapi.board.BoardStackup stackup = 1;
}

// Replaces the physical stackup of the given board (layer thicknesses, dielectric materials,
// solder mask, finish and impedance control).  The copper layers in the stackup must match the
// copper layers enabled on the board, from F.Cu to B.Cu; change the copper layer count with
// SetBoardEnabledLayers first (which also updates the stackup).  Disabled items, and items on
// technical layers not enabled on the board, are dropped.  The board thickness is recomputed from
// the stackup.  This operation cannot be undone.
// Returns BoardStackupResponse with the updated stackup, in normalized form
message UpdateBoardStackup
{
  kiapi.common.types.DocumentSpecifier board = 1;
  kiapi.board.BoardStackup stackup = 2;
}

message GetBoardEnabledLayers
{
  kiapi.common.types.DocumentSpecifier board = 1;
}

message BoardEnabledLayersResponse
{
  // The number of copper layers enabled in this board.
  uint32 copper_layer_count = 1;

  // A list of all layers enabled in this board, including copper layers and ones which cannot be disabled.
  repeated kiapi.board.types.BoardLayer layers = 2;
}

// Changes which layers are enabled in the board stackup
// WARNING: any existing content on layers that are removed by this call is deleted.  This operation cannot be undone.
// Returns BoardEnabledLayersResponse with the updated layer set.
message SetBoardEnabledLayers
{
  kiapi.common.types.DocumentSpecifier board = 1;

  // The number of copper layers to enable in the board.  Currently, this must be an even number >= 2.
  uint32 copper_layer_count = 2;

  // The non-copper layers to enable.  Note that any copper layers in this list are ignored; copper layers are enabled
  // by setting copper_layer_count.  Note that the F/B.Courtyard, Edge.Cuts, and Margin layers cannot be disabled and
  // will be present in the board even if they are omitted from this list.
  repeated kiapi.board.types.BoardLayer layers = 3;
}

// Returns kiapi.common.types.EmbeddedFiles
message GetEmbeddedFiles
{
  kiapi.common.types.DocumentSpecifier board = 1;
}

// Appends embedded files to the board.  Returns Empty.
message AddEmbeddedFiles
{
  kiapi.common.types.DocumentSpecifier board = 1;
  kiapi.common.types.EmbeddedFiles files = 2;
}

// Replaces all embedded files in the board.  Returns Empty.
message SetEmbeddedFiles
{
  kiapi.common.types.DocumentSpecifier board = 1;
  kiapi.common.types.EmbeddedFiles files = 2;
}

message GetGraphicsDefaults
{
  kiapi.common.types.DocumentSpecifier board = 1;
}

message GraphicsDefaultsResponse
{
  kiapi.board.GraphicsDefaults defaults = 1;
}

enum CustomRulesStatus
{
  CRS_UNKNOWN = 0;
  CRS_NONE = 1;
  CRS_VALID = 2;
  CRS_INVALID = 3;
}

message GetBoardDesignRules
{
  kiapi.common.types.DocumentSpecifier board = 1;
}

message SetBoardDesignRules
{
  kiapi.common.types.DocumentSpecifier board = 1;
  kiapi.board.BoardDesignRules rules = 2;
}

message BoardDesignRulesResponse
{
  kiapi.board.BoardDesignRules rules = 1;
  CustomRulesStatus custom_rules_status = 2;
}

message GetCustomDesignRules
{
  kiapi.common.types.DocumentSpecifier board = 1;
}

// Returns CustomRulesResponse
message SetCustomDesignRules
{
  kiapi.common.types.DocumentSpecifier board = 1;
  repeated kiapi.board.CustomRule rules = 2;
}

message CustomRulesResponse
{
  CustomRulesStatus status = 1;
  repeated kiapi.board.CustomRule rules = 2;
  string error_text = 3;
}

enum BoardOriginType
{
  BOT_UNKNOWN = 0;
  BOT_GRID = 1;
  BOT_DRILL = 2;
}

// Returns a Vector2 with the specified origin point
message GetBoardOrigin
{
  kiapi.common.types.DocumentSpecifier board = 1;

  BoardOriginType type = 2;
}

message SetBoardOrigin
{
  kiapi.common.types.DocumentSpecifier board = 1;

  BoardOriginType type = 2;

  kiapi.common.types.Vector2 origin = 3;
}

message GetBoardLayerName
{
  kiapi.common.types.DocumentSpecifier board = 1;

  kiapi.board.types.BoardLayer layer = 2;
}

message BoardLayerNameResponse
{
  // The name of the layer shown in the KiCad GUI, which may be a default value like "F.Cu" or may
  // have been customized by the user.
  string name = 1;
}

// Since: 10.0.6
// Returns BoardLayerResponse
message GetBoardLayerByName
{
  kiapi.common.types.DocumentSpecifier board = 1;

  // A name to retrieve the layer ID for, which may be a user-customized or a KiCad standard one.
  string name = 2;
}

/*
 * Net management
 */

message GetNets
{
  kiapi.common.types.DocumentSpecifier board = 1;

  // If provided, will only return nets that belong to the given netclass.
  // If more than one netclass_filter is given, nets belonging to any of the given classes will
  // be returned.
  repeated string netclass_filter = 2;
}

message NetsResponse
{
  repeated kiapi.board.types.Net nets = 1;
}

// Retrieve all the copper items belonging to a certain net or set of nets
// returns kiapi.common.commands.GetItemsResponse
message GetItemsByNet
{
  // Specifies which document to query, which fields to return, etc.
  kiapi.common.types.ItemHeader header = 1;

  // Optional list of item types to filter by.  If not provided, will return pads, vias,
  // tracks, and zones.
  repeated kiapi.common.types.KiCadObjectType types = 2;

  // Removed; NetCode was deprecated before a handler for this was written
  // repeated kiapi.board.types.NetCode net_codes = 3;

  // A list of nets to filter items by
  repeated kiapi.board.types.Net nets = 4;
}

// Retrieve all the copper items belonging to a certain net class or set of net classes
// returns kiapi.common.commands.GetItemsResponse
message GetItemsByNetClass
{
  // Specifies which document to query, which fields to return, etc.
  kiapi.common.types.ItemHeader header = 1;

  // Optional list of item types to filter by.  If not provided, will return pads, vias,
  // tracks, and zones.
  repeated kiapi.common.types.KiCadObjectType types = 2;

  // A list of net class names to filter items by
  repeated string net_classes = 3;
}

// Retrieve all copper-connected items connected to one or more source items
// returns kiapi.common.commands.GetItemsResponse
message GetConnectedItems
{
  // Specifies which document to query, which fields to return, etc.
  kiapi.common.types.ItemHeader header = 1;

  // One or more item IDs used as the source set for connectivity queries
  repeated kiapi.common.types.KIID items = 2;

  // Optional list of item types to return. If empty, all connected item types are returned.
  repeated kiapi.common.types.KiCadObjectType types = 3;
}

// A net may be part of multiple classes that have a priority ordering, which will result in a
// composite "effective" netclass containing the merged/overridden properties of all the constituent
// netclasses it contains.  This message retrieves this effective netclass for a net or list of
// nets.
// Returns NetClassForNetsResponse
message GetNetClassForNets
{
  repeated kiapi.board.types.Net net = 1;
}

message NetClassForNetsResponse
{
  // Map of net name to netclass info
  map<string, kiapi.common.project.NetClass> classes = 1;
}

// Retrieves the connections that still need to be routed (the ratsnest).  Each entry is one
// ratsnest line between two connected items of the same net that are not yet joined by copper.
// Returns UnroutedConnectionsResponse
// Since: 11.0
message GetUnroutedConnections
{
  kiapi.common.types.DocumentSpecifier board = 1;

  // Optional list of nets to report.  If empty, all nets are reported.
  repeated kiapi.board.types.Net nets = 2;
}

// Since: 11.0
message UnroutedConnection
{
  kiapi.board.types.Net net = 1;

  // The item at each end of the ratsnest line (usually a pad, track, via or zone)
  kiapi.common.types.KIID from_item = 2;
  kiapi.common.types.Vector2 from_position = 3;
  kiapi.common.types.KIID to_item = 4;
  kiapi.common.types.Vector2 to_position = 5;

  // Straight-line distance between the two ends
  kiapi.common.types.Distance length = 6;

  // False if the line is hidden in the editor (for example because its net is hidden)
  bool visible = 7;
}

// Since: 11.0
message UnroutedConnectionsResponse
{
  repeated UnroutedConnection connections = 1;
}

// Retrieves routed lengths and propagation delays of nets, computed the same way as the Net
// Inspector and the length-tuning DRC checks (via and pad-to-die lengths included).
// Returns NetLengthsResponse
// Since: 11.0
message GetNetLengths
{
  kiapi.common.types.DocumentSpecifier board = 1;

  // Nets to report.  If empty, every net with at least one pad is reported.
  repeated kiapi.board.types.Net nets = 2;

  // Also compute propagation delays (uses the tuning profiles of the nets' netclasses)
  bool include_delay = 3;
}

// Since: 11.0
message NetLayerLength
{
  kiapi.board.types.BoardLayer layer = 1;
  kiapi.common.types.Distance length = 2;
  kiapi.common.types.Time delay = 3;
}

// Since: 11.0
message NetLength
{
  kiapi.board.types.Net net = 1;

  kiapi.common.types.Distance track_length = 2;
  kiapi.common.types.Distance via_length = 3;
  kiapi.common.types.Distance pad_to_die_length = 4;

  // Sum of track, via and pad-to-die length
  kiapi.common.types.Distance total_length = 5;

  // Delays are zero unless include_delay was set
  kiapi.common.types.Time track_delay = 6;
  kiapi.common.types.Time via_delay = 7;
  kiapi.common.types.Time pad_to_die_delay = 8;
  kiapi.common.types.Time total_delay = 9;

  int32 pad_count = 10;
  int32 via_count = 11;

  // Track length per copper layer
  repeated NetLayerLength layers = 12;

  // Sum of the ratsnest lines still to route on this net
  kiapi.common.types.Distance unrouted_length = 13;
}

// Since: 11.0
message NetLengthsResponse
{
  repeated NetLength nets = 1;
}

// Resolves the design-rule constraint that applies to one item, or between two items, on a layer
// (as the "Constraints Resolution" inspector does), including which rule produced it.
// Returns QueryConstraintResponse
// Since: 11.0
message QueryConstraint
{
  kiapi.common.types.DocumentSpecifier board = 1;

  // The constraint to resolve, e.g. CRCT_CLEARANCE, CRCT_TRACK_WIDTH, CRCT_DIFF_PAIR_GAP,
  // CRCT_LENGTH, CRCT_SKEW, CRCT_VIA_DIAMETER, CRCT_HOLE_SIZE
  kiapi.board.CustomRuleConstraintType constraint = 2;

  kiapi.common.types.KIID item_a = 3;

  // Required for two-item constraints such as clearance; otherwise leave unset
  optional kiapi.common.types.KIID item_b = 4;

  // Layer to evaluate on; defaults to the first copper layer item_a exists on
  optional kiapi.board.types.BoardLayer layer = 5;

  // Also return the human-readable rule resolution trace
  bool include_report = 6;
}

// Since: 11.0
message QueryConstraintResponse
{
  // False if no rule defines this constraint for the items
  bool found = 1;

  // Values in nanometres (or attoseconds for time-domain length/skew constraints)
  optional int64 min = 2;
  optional int64 opt = 3;
  optional int64 max = 4;

  // Name of the rule or netclass that set the value, e.g. "netclass 'Default'"
  string source = 5;

  kiapi.common.types.RuleSeverity severity = 6;

  // Rule resolution trace when include_report was set
  string report = 7;
}

// Since: 11.0
enum RouterMode
{
  RTM_UNKNOWN = 0;
  RTM_SINGLE = 1;     // a single track
  RTM_DIFF_PAIR = 2;  // both nets of a differential pair, starting from either of them
}

// How the router treats obstacles (Router Settings > Mode)
// Since: 11.0
enum RouterCollisionMode
{
  RCM_UNKNOWN = 0;
  RCM_WALKAROUND = 1;       // route around existing items (default)
  RCM_SHOVE = 2;            // push existing tracks and vias aside
  RCM_MARK_OBSTACLES = 3;   // allow collisions; they are reported by DRC
}

// A point the router passes through.  When layer is set and differs from the layer being routed,
// the router places a via at the point and continues on that layer, as if the user switched
// layers there.  Layer changes need the walkaround or shove collision mode.
// Since: 11.0
message RouteWaypoint
{
  kiapi.common.types.Vector2 position = 1;
  optional kiapi.board.types.BoardLayer layer = 2;
}

// Routes a connection with the interactive push-and-shove router, as if a user started at
// start_item, clicked each waypoint and finished on end_item.  Clearances, widths and
// differential-pair gaps come from the design rules unless overridden.  The routed items are
// committed as one undoable change.
// Returns RouteConnectionResponse
// Since: 11.0
message RouteConnection
{
  kiapi.common.types.DocumentSpecifier board = 1;

  // Pad, via or track to start from
  kiapi.common.types.KIID start_item = 2;

  // Start point; defaults to the start item's position (required when starting from a track)
  optional kiapi.common.types.Vector2 start_position = 3;

  // Pad, via or track to finish on
  kiapi.common.types.KIID end_item = 4;

  // End point; defaults to the end item's position
  optional kiapi.common.types.Vector2 end_position = 5;

  // Intermediate points the route must pass through, in order
  repeated kiapi.common.types.Vector2 waypoints = 6;

  // Copper layer to route on; defaults to the start item's first copper layer
  optional kiapi.board.types.BoardLayer layer = 7;

  RouterMode mode = 8;
  RouterCollisionMode collision_mode = 9;

  // Overrides for the rule-derived sizes
  optional kiapi.common.types.Distance track_width = 10;
  optional kiapi.common.types.Distance diff_pair_gap = 11;

  // Waypoints that may change layers.  Use either these or waypoints, not both.
  repeated RouteWaypoint route_waypoints = 12;

  // Type of the vias placed at layer changes; defaults to through vias.  Blind, buried and micro
  // vias between the two outer layers are placed as through vias.
  optional kiapi.board.types.ViaType via_type = 13;

  // Overrides for the rule-derived via sizes
  optional kiapi.common.types.Distance via_diameter = 14;
  optional kiapi.common.types.Distance via_drill = 15;
}

// Since: 11.0
message RouteConnectionResponse
{
  // True if the route reached the end item and was committed
  bool success = 1;

  // Router message when the route could not be completed
  string failure_reason = 2;

  // Tracks, arcs and vias the router added
  repeated google.protobuf.Any created_items = 3;

  // Items the router removed or replaced (for example shoved tracks)
  repeated kiapi.common.types.KIID removed_items = 4;
}

/*
 * Netlist import
 */

// How schematic components are matched to board footprints during netlist import.
enum NetlistMatchMode
{
  NMM_UNKNOWN = 0;
  NMM_UUID = 1;      // Match by unique ID.
  NMM_REFERENCE = 2; // Match by reference designator.
}

// Imports a netlist file exported from the schematic and updates the board.
// Returns ImportNetlistResponse.
message ImportNetlist
{
  kiapi.common.types.DocumentSpecifier board = 1;

  // Path to the netlist file.
  string netlist_path = 2;

  // If true, report planned changes without modifying the board.
  bool dry_run = 3;

  NetlistMatchMode match_mode = 4;

  bool delete_extra_footprints = 5;
  bool update_footprints = 6;
  bool transfer_groups = 7;
  bool override_locks = 8;
}

message ImportNetlistResponse
{
  uint32 error_count = 1;
  uint32 warning_count = 2;
  uint32 new_footprint_count = 3;

  // Human-readable report of changes and any warnings or errors.
  string report = 4;
}

// Imports a Specctra session file into the board: repositions footprints, deletes unlocked
// existing tracks and vias, and adds the tracks and vias routed in the external router session.
// Locked tracks and vias are skipped (they are exported as fixed and omitted from the session
// by design).
// Since: 11.0
message ImportSpecctraSession
{
  kiapi.common.types.DocumentSpecifier board = 1;

  // Path to the Specctra session file (.ses).
  string session_path = 2;
}

message ImportSpecctraSessionResponse
{
  // Number of session items skipped due to unresolved reference, layer, or padstack.
  uint32 skipped_count = 1;

  // Human-readable report of what was imported and any warnings or errors.
  string report = 2;
}

/*
 * Blocking operations
 */

// Refills some or all zones on the board.
// When zones is empty and a board editor is running, all zones are refilled in the background:
// Empty is returned immediately and KiCad returns ApiStatusCode.AS_BUSY to all future API
// requests until the fill completes.  When specific zones are given, or in headless sessions,
// the fill runs synchronously and the response is not sent until it has completed.
message RefillZones
{
  kiapi.common.types.DocumentSpecifier board = 1;

  // A list of zones to refill.  If empty, all zones are refilled.
  repeated kiapi.common.types.KIID zones = 2;
}

/*
 * Utilities
 */

// Computes the polygon representation of a pad, merging any custom shapes together.
// This representation will approximate curves as a series of segments.
message GetPadShapeAsPolygon
{
  // The board to process
  kiapi.common.types.DocumentSpecifier board = 1;

  // A list of one or more pads to process
  repeated kiapi.common.types.KIID pads = 2;

  // The layer to process
  kiapi.board.types.BoardLayer layer = 3;
}

// Returned from GetPadShapeAsPolygon.  The pads and polygons repeated fields will have the same length
// and can be treated as a list of tuples.
message PadShapeAsPolygonResponse
{
  // The pads that were processed
  repeated kiapi.common.types.KIID pads = 1;

  // The polygon representation of each pad
  repeated kiapi.common.types.PolygonWithHoles polygons = 2;
}

// Tests if the given set of items with padstacks (pads or vias) has content on the given set of layers.
// This is a dynamic call rather than a property of the padstack because pads and vias can be set to only include
// shapes on connected copper layers, and whether or not the pad is connected can't be determined in isolation.
// To optimize API call performance, multiple items and multiple layers to test may be passed in with this
// command message.  The return will include the results for each valid item on each valid layer.
// Note that not all layers make sense for a given item (for example, testing against BL_UNDEFINED never makes
// sense).  In general, the internal KiCad APIs will not return an error when testing non-sensical layers for a given
// item, and instead will return a default of "true" for any such layers.
message CheckPadstackPresenceOnLayers
{
  kiapi.common.types.DocumentSpecifier board = 1;

  repeated kiapi.common.types.KIID items = 2;

  repeated kiapi.board.types.BoardLayer layers = 3;
}

enum PadstackPresence
{
  PSP_UNKNOWN = 0;
  PSP_PRESENT = 1;      // The padstack has a shape on a given layer (is flashed)
  PSP_NOT_PRESENT = 2;  // The padstack has no shape on a given layer (is not flashed)
}

message PadstackPresenceEntry
{
  kiapi.common.types.KIID item = 1;
  kiapi.board.types.BoardLayer layer = 2;
  PadstackPresence presence = 3;
}

message PadstackPresenceResponse
{
  repeated PadstackPresenceEntry entries = 1;
}

