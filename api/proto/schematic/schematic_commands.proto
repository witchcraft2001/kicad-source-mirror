syntax = "proto3";

package kiapi.schematic.commands;

import "common/types/base_types.proto";
import "common/types/enums.proto";
import "schematic/schematic_types.proto";
import "google/protobuf/any.proto";


message GetSchematicHierarchy
{
  // Type must be DT_SCHEMATIC and only the project is considered
  kiapi.common.types.DocumentSpecifier document = 1;
}

message SchematicHierarchyResponse
{
  kiapi.common.types.DocumentSpecifier document = 1;

  repeated kiapi.schematic.types.SheetInstance top_level_sheets = 2;
}

// Returns SchematicNetlistResponse
message GetSchematicNetlist
{
  // Type must be DT_SCHEMATIC and only the project is considered
  kiapi.common.types.DocumentSpecifier document = 1;

  // Optional filter for types of items to return in SchematicNetSheetContents items fields.
  // If not specified, all types will be returned.  Only connectable schematic items are valid
  // here (pins, labels, wires, etc).
  repeated kiapi.common.types.KiCadObjectType types = 2;
}

message SchematicNetlistResponse
{
  kiapi.common.types.DocumentSpecifier document = 1;

  repeated kiapi.schematic.types.SchematicNet nets = 2;
}

// Requests placement of a symbol on a schematic
// Returns PlaceFromLibraryResponse
// Since: 11.0
message PlaceSymbolFromLibrary
{
  // header.document must specify the sheet path to place on
  kiapi.common.types.ItemHeader header = 1;

  kiapi.common.types.LibraryIdentifier lib_id = 2;

  kiapi.common.types.Vector2 position = 3;

  // If unspecified, will use default orientation
  optional kiapi.schematic.types.SchematicSymbolOrientation orientation = 4;

  // If unspecified, will place the first unit of a multi-unit symbol
  optional kiapi.schematic.types.SchematicSymbolUnit unit = 5;

  // If unspecified, KiCad will either leave the symbol unannotated or automatically annotate it
  // depending on the user's current auto-annotation preference.
  optional string reference = 6;
}

// Retrieves the pins of placed symbols in sheet coordinates, after the symbol's rotation and
// mirroring have been applied.  This is the point where a wire must end to connect to the pin.
// Returns SymbolPinsResponse
// Since: 11.0
message GetSymbolPins
{
  // The schematic.  If document.sheet_path is set, only symbols on that sheet are considered and
  // net names are resolved for that sheet instance.
  kiapi.common.types.DocumentSpecifier document = 1;

  // Symbols to report.  If empty, every symbol in scope is reported.
  repeated kiapi.common.types.KIID symbols = 2;
}

// Since: 11.0
message PlacedSymbolPin
{
  kiapi.common.types.KIID id = 1;
  string number = 2;
  string name = 3;

  // Connection point of the pin in sheet coordinates
  kiapi.common.types.Vector2 position = 4;

  // Orientation of the pin on the sheet (after symbol rotation and mirroring).  A wire leaves the
  // connection point in the opposite direction.
  kiapi.schematic.types.SchematicPinOrientation orientation = 5;

  kiapi.common.types.ElectricalPinType electrical_type = 6;

  // Name of the net connected to the pin, if connectivity has been computed
  string net_name = 7;

  // True if nothing is connected to the pin
  bool dangling = 8;
}

// Since: 11.0
message SymbolPins
{
  kiapi.common.types.KIID symbol = 1;
  kiapi.common.types.SheetPath path = 2;
  string reference = 3;
  repeated PlacedSymbolPin pins = 4;
}

// Since: 11.0
message SymbolPinsResponse
{
  repeated SymbolPins symbols = 1;
}

// Since: 11.0
enum AnnotationScope
{
  ANS_UNKNOWN = 0;

  // Every symbol in the schematic
  ANS_ALL = 1;

  // Symbols on the sheet given in document.sheet_path (the root sheet if unset)
  ANS_SHEET = 2;
}

// Since: 11.0
enum AnnotationOrder
{
  ANO_UNKNOWN = 0;
  ANO_X_POSITION = 1;  // left to right, then top to bottom
  ANO_Y_POSITION = 2;  // top to bottom, then left to right
}

// Since: 11.0
enum AnnotationAlgorithm
{
  ANA_UNKNOWN = 0;
  ANA_INCREMENTAL = 1;    // first free number after start_number
  ANA_SHEET_X100 = 2;     // sheet number * 100 + first free number
  ANA_SHEET_X1000 = 3;    // sheet number * 1000 + first free number
}

// Assigns reference designators, like the Annotate Schematic dialog.  Power symbols are skipped.
// The change is a single undoable commit (or part of the client's open commit).
// Returns AnnotateSchematicResponse
// Since: 11.0
message AnnotateSchematic
{
  kiapi.common.types.DocumentSpecifier document = 1;

  // Defaults to ANS_ALL
  AnnotationScope scope = 2;

  // Defaults to ANO_X_POSITION
  AnnotationOrder order = 3;

  // Defaults to ANA_INCREMENTAL
  AnnotationAlgorithm algorithm = 4;

  // First number to use with ANA_INCREMENTAL; values below 1 are treated as 1
  int32 start_number = 5;

  // Renumber every symbol in scope instead of only the unannotated ones (R? style)
  bool reset_existing = 6;

  // With ANS_SHEET, also annotate the sheets below the given one
  bool recursive = 7;

  // Allow units of multi-unit symbols to be regrouped into new packages
  bool regroup_units = 8;
}

// Since: 11.0
message AnnotationChange
{
  kiapi.common.types.KIID symbol = 1;
  kiapi.common.types.SheetPath path = 2;

  // Empty if the symbol had no reference before (for example "R?")
  string old_reference = 3;
  string new_reference = 4;
}

// Since: 11.0
message AnnotateSchematicResponse
{
  repeated AnnotationChange changes = 1;
}

// Which parts of a symbol are reset to the library definition by ChangeSymbols.  Every flag that is
// not set takes the default of the Update Symbols or Change Symbols dialog of the schematic editor.
// Since: 11.0
message ChangeSymbolsOptions
{
  // The fields to update from the library, by their untranslated names.  Empty means every field
  // except Reference and Value, as in the dialog.  Listing "Reference" gives the symbol the
  // reference prefix of the library symbol and keeps its number where it is free.
  repeated string fields = 1;

  // Remove the fields that the library symbol does not have (default: false)
  optional bool remove_extra_fields = 2;

  // Clear the text of the updated fields that are empty in the library (default: false)
  optional bool reset_empty_fields = 3;

  // Take the text of the updated fields from the library (default: true)
  optional bool reset_field_text = 4;

  // Take the value of a power symbol from the library too (default: false)
  optional bool reset_custom_power_value = 5;

  // Reset the visibility of the updated fields (default: false when updating, true when changing)
  optional bool reset_field_visibilities = 6;

  // Reset the text size, style and justification of the updated fields
  // (default: false when updating, true when changing)
  optional bool reset_field_effects = 7;

  // Reset the positions of the updated fields (default: false when updating, true when changing)
  optional bool reset_field_positions = 8;

  // Reset the exclude from simulation, BOM, board and position files attributes
  // (default: false when updating, true when changing)
  optional bool reset_attributes = 9;

  // Reset the visibility of pin names and numbers (default: false when updating, true when changing)
  optional bool reset_pin_text_visibility = 10;

  // Clear the alternate pin functions (default: false when updating, true when changing)
  optional bool reset_alternate_pins = 11;

  // Clear the pin map overrides (default: false when updating, true when changing)
  optional bool reset_pin_map_overrides = 12;
}

// Since: 11.0
message SymbolChange
{
  // A placed symbol.  Each unit of a multi-unit symbol is its own item.
  kiapi.common.types.KIID symbol = 1;

  // The unit this item shows after the change.  If unset, the unit is kept.
  optional int32 unit = 2;
}

// Replaces the library symbol of placed symbols, like the Update Symbols from Library and Change
// Symbols dialogs of the schematic editor.  The UUID, position, orientation, unit, reference and
// per-sheet instance data of each symbol are kept; pins are matched to the new symbol by number
// and keep their UUIDs.  Wires, labels, junctions and no-connect flags are not moved: a pin that
// sits somewhere else in the new symbol is left unconnected.  A symbol on a sheet that is used
// more than once is shared by all those sheets.
// Returns ChangeSymbolsResponse
// Since: 11.0
message ChangeSymbols
{
  kiapi.common.types.ItemHeader header = 1;

  repeated SymbolChange symbols = 2;

  // If set, the symbols are changed to this library symbol (Change Symbols); refused while a design
  // variant is active.  If unset, each symbol is updated from the library symbol it already refers
  // to (Update Symbols from Library).
  kiapi.common.types.LibraryIdentifier lib_id = 3;

  ChangeSymbolsOptions options = 4;

  // Report what would change without changing anything
  bool dry_run = 5;
}

// Since: 11.0
enum SymbolChangeStatus
{
  SCS_UNKNOWN = 0;

  // The symbol was changed (or would be, for a dry run)
  SCS_CHANGED = 1;

  // Nothing about the symbol would change: it already is what the update or change makes it
  SCS_UNCHANGED = 2;

  // The library symbol could not be found or loaded; see the message
  SCS_NOT_FOUND = 3;

  // The item does not exist, is not a symbol, or is listed more than once
  SCS_NONEXISTENT = 4;

  // The library symbol has fewer units than the symbol needs
  SCS_TOO_FEW_UNITS = 5;
}

// Since: 11.0
message SymbolChangeResult
{
  kiapi.common.types.KIID symbol = 1;
  SymbolChangeStatus status = 2;

  // The library symbol the symbol refers to after the change
  kiapi.common.types.LibraryIdentifier lib_id = 3;

  // What went wrong, or notes such as other units of the same reference that were not listed
  string message = 4;

  // The reference of the symbol on each sheet it is used on, after the change
  repeated string references = 5;

  // The symbol after the change (not set for a dry run or a failure)
  google.protobuf.Any item = 6;
}

// Since: 11.0
message ChangeSymbolsResponse
{
  kiapi.common.types.ItemHeader header = 1;
  repeated SymbolChangeResult results = 2;
}

// Resolved bus membership from KiCad's connection engine. Optional expression is parsed read-only.
message GetSchematicBuses
{
  kiapi.common.types.DocumentSpecifier document = 1;
  string expression = 2;
}
message SchematicBus
{
  kiapi.common.types.KIID item = 1;
  kiapi.common.types.SheetPath path = 2;
  string name = 3;
  repeated string members = 4;
  // Local declaration names, in the same ordinal order as canonical members.
  repeated string declaration_members = 5;
}
message SchematicBusesResponse
{
  repeated SchematicBus buses = 1;
  repeated string expression_members = 2;
}
message SchematicBusAlias
{
  string name = 1;
  repeated string members = 2;
}
message GetSchematicBusAliases
{
  kiapi.common.types.DocumentSpecifier document = 1;
}
message SetSchematicBusAliases
{
  kiapi.common.types.DocumentSpecifier document = 1;
  repeated SchematicBusAlias aliases = 2;
}
message SchematicBusAliasesResponse
{
  repeated SchematicBusAlias aliases = 1;
}
